# Display length for quote text on cards/videos (longer quotes are shortened at sentence or word boundary)
quote_cards:
  max_display_length: 120  # characters; use shorter quotes on generated cards

quote_extraction:
  method: intelligent  # 'simple' or 'intelligent'
  chunk_size: 5000  # Characters per chunk
  chunk_overlap: 500  # Overlap between chunks
  max_quotes_per_chunk: 10
  max_total_quotes: 100
  min_quote_length: 20
  max_quote_length: 500
  enable_summarization: true
  enable_thematic_tagging: true
  # Key yoga concepts to prioritize during extraction
  priority_concepts:
    - sattva
    - rajas
    - tamas
    - gunas
    - prakriti
    - purusha
    - dharma
    - karma
    - moksha
    - samadhi
    - dhyana
    - pranayama
    - asana
    - yama
    - niyama
    - chitta
    - vrittis
    - dharana
    - pratyahara
ai:
  provider: anthropic
  model: claude-sonnet-4-6
  language: en
instagram:
  feed_dimensions:
    width: 1080
    height: 1080
  reel_dimensions:
    width: 1080
    height: 1920
  reel_duration:
    min: 15
    max: 90
